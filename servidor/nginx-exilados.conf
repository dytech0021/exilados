# Exilados em https://filabox3d.com.br/exilados/. Fica em /etc/nginx/snippets/exilados.conf e entra no bloco do
# FilaBox (sites-enabled/filabox) com uma linha:  include /etc/nginx/snippets/exilados.conf;
# O site do FilaBox e os caminhos /ponte/ não mudam.

location = /exilados {
    return 301 /exilados/;
}

# Permissões de voz e de live (exilados-api, só em 127.0.0.1).
location /exilados/api/ {
    proxy_pass http://127.0.0.1:7415/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 8k;
    proxy_read_timeout 20s;
}

# Voz: sinalização do LiveKit por WebSocket (o cliente acrescenta /rtc ao endereço wss://filabox3d.com.br/exilados).
# O áudio vai direto ao LiveKit por UDP 7882 ou TCP 7881.
location /exilados/rtc {
    proxy_pass http://127.0.0.1:7880/rtc;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Lives: WebRTC (WHEP) do MediaMTX. Quem pode assistir é decidido pelo exilados-api; o vídeo vai pela porta 8189.
location /exilados/ao-vivo/ {
    proxy_pass http://127.0.0.1:8889/;
    # O MediaMTX devolve o endereço da sessão a partir da raiz dele.
    proxy_redirect /ex/ /exilados/ao-vivo/ex/;
    # Recusa sem pedido de usuário e senha: o site trata o 401 (live encerrada) sozinho.
    proxy_hide_header WWW-Authenticate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    client_max_body_size 64k;
}

# Atualização do programa do Windows: manifesto assinado e executável (quem garante é a assinatura).
location /exilados/atualizacao/ {
    alias /var/www/exilados/atualizacao/;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /exilados/manifest.webmanifest {
    root /var/www/exilados/www;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

# O site (estático). As bibliotecas de vendor/ têm versão fixa no nome da pasta e podem ficar em cache.
location /exilados/ {
    root /var/www/exilados/www;
    index index.html;
    try_files $uri $uri/ =404;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), autoplay=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://kobtvgqnitdeviddvymm.supabase.co; media-src 'self' blob:; connect-src 'self' https://kobtvgqnitdeviddvymm.supabase.co wss://kobtvgqnitdeviddvymm.supabase.co wss://filabox3d.com.br; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
